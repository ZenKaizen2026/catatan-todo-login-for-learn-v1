name: CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catatan_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check backend project
        id: check_backend
        run: |
          if [ -f backend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend belum diinisialisasi (Fase 2 setup)."
          fi

      - name: Install dependencies
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Lint
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck

      - name: Test
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catatan_todo_test?schema=public
          JWT_SECRET: ci-test-secret-minimal-32-karakter-aman
          JWT_EXPIRES_IN: 1h
          CORS_ORIGIN: http://localhost:5173
        run: npm test

  frontend:
    name: Frontend (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check frontend project
        id: check_frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend belum diinisialisasi (Fase 2 setup)."
          fi

      - name: Install dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test
